[package]
name = "swarmx-writing-preview-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
typst = "0.15.1"
typst-ide = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "embedded-fonts", "scan-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"

[profile.release]
lto = "thin"
strip = true
