site_name: SwarmX
site_url: https://tcztzy.github.io/swarmx/
repo_url: https://github.com/tcztzy/swarmx

theme:
  name: material
  features:
    - navigation.indexes
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
- search

markdown_extensions:
- admonition
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
- attr_list

nav:
- Home: index.md
- Codebase map:
  - Overview: codebase/index.md
  - Core: codebase/core.md
  - Desktop: codebase/desktop.md
  - CLI, runtime, ACP, launcher: codebase/cli-runtime.md
  - Tests and auxiliary source: codebase/tests.md
- Product vision: vision.md
- Publication research strategy: publication-research-strategy.md
  - Guides:
    - Durable task runtime: durable-task-runtime.md
    - Auditability: auditability.md
    - Extensions and Custom Agents: extensions-custom-agents.md
    - Skill self-improvement (evolution): skill-evolution.md
    - Multimedia attachments: multimedia.md
  - Native tool compatibility: native-tool-compatibility.md
  - Claude Code tool parity: claude-code-tool-parity.md
  - OpenAI-compatible server: server.md
  - Hooks: hooks.md
