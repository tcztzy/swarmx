site_name: SwarmX
site_url: https://tcztzy.github.io/swarmx/
repo_url: https://github.com/tcztzy/swarmx

theme:
  name: material
  features:
    - navigation.indexes
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
- search

markdown_extensions:
- admonition
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
- attr_list

nav:
- Home: index.md
- Product vision: vision.md
- Guides:
  - Extensions and Custom Agents: extensions-custom-agents.md
  - Multimedia attachments: multimedia.md
  - Native tool compatibility: native-tool-compatibility.md
  - Claude Code tool parity: claude-code-tool-parity.md
  - OpenAI-compatible server: server.md
  - Hooks: hooks.md
