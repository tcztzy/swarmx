repos:
  - repo: local
    hooks:
      - id: biome
        name: Biome
        entry: node node_modules/@biomejs/biome/bin/biome check
        language: system
        types_or: [ts, tsx]
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --manifest-path native/writing-preview-runtime/Cargo.toml --check
        language: system
        types: [rust]
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
