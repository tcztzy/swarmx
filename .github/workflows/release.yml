name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to prepare as a draft release
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm docs:check && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm paper:demo
      - name: Archive the reviewed source
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const version = JSON.parse(readFileSync("apps/desktop/package.json")).version; if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Tag must match the desktop manifest version")'
          git archive --format=tar.gz --prefix="swarmx-${RELEASE_TAG}/" --output="swarmx-${RELEASE_TAG}.tar.gz" HEAD
          sha256sum "swarmx-${RELEASE_TAG}.tar.gz" > SHA256SUMS
      - name: Prepare draft release for author review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" "swarmx-${RELEASE_TAG}.tar.gz" SHA256SUMS --verify-tag --draft --generate-notes --title "SwarmX $RELEASE_TAG"
