name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm paper:demo
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - run: docker build --tag swarmx-research:ci apps/desktop/resources/python
      - run: pnpm vitest run apps/desktop/tests/research-environment.test.ts
        env:
          SWARMX_TEST_DOCKER_IMAGE: swarmx-research:ci
