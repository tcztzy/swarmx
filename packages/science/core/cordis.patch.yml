# Product-owned science slice. SwarmX loads this layer after DSH bundles and
# before user patches, so either row can be disabled or replaced by id.

- id: ui-deliverables
  disabled: true

- insert:
    - id: swarmx-science
      name: '@swarmx/dsh-science'
      config:
        root: !!js dshHomePath('science')

    - id: swarmx-ui-science
      name: '@swarmx/dsh-ui-science'
