# Bundle patch for the conversation extensions plugin.
#
# Declaring `dsh.bundle.patch` makes this package self-installing: adding it to
# a profile's bundle list inserts these rows, with no hand-edited profile patch.
#
# The row is a `dsh.client` package, so the host serves its browser bundle and
# the shell loads it into the module table. Nothing host-side is configured.

- insert:
    - id: swarmx-conversation
      name: '@swarmx/dsh-ui-conversation'
