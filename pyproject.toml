[project]
name = "swarmx"
version = "4.0.0"
description = "Python worker and private MCP servers for the SwarmX polyglot runtime."
requires-python = ">=3.11,<3.15"
dependencies = [
  "dspy==3.3.0",
  "libzim==3.12.0",
  "mcp==2.0.0",
]

[project.scripts]
swarmx-ref = "swarmx.ref.server:main"
swarmx-rsi = "swarmx.rsi.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmx"]

# Evaluation tooling is opt-in and is never installed into the product worker
# environment unless the inspect group is selected explicitly.
[dependency-groups]
inspect = [
  "inspect-ai>=0.3",
]

[tool.uv]
package = true

[tool.swarmx.worker]
protocol-version = 1
entrypoint = "src/swarmx/worker.py"
