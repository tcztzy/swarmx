packages:
  - packages/*/*
  - apps/*

overrides:
  '@deepseek-ai/cordis-plugin-group': 1.0.2
  '@deepseek-ai/dsh-authorization': 0.1.2-alpha.2
  '@deepseek-ai/dsh-jobs': 0.1.2-alpha.2
  '@deepseek-ai/dsh-session-persistence': 0.1.2-alpha.2
  '@deepseek-ai/dsh-settings': 0.1.2-alpha.2

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  electron: true
  esbuild: true
  koffi: true
  node-addon-require-builtin: false
  node-pty: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh'
  - '@deepseek-ai/dsh-*'
  - '@xmldom/xmldom@0.9.12'
  - '@deepseek-ai/cordis-plugin-hmr@1.0.17'
  - '@deepseek-ai/cordis-plugin-group@1.0.2'
  - '@deepseek-ai/cordis-plugin-include@1.0.7'
  - '@deepseek-ai/cordis-plugin-loader@1.0.3'
  - '@deepseek-ai/cordis-plugin-timer@1.1.4'
  - '@deepseek-ai/cordis@4.0.2'
  - '@deepseek-ai/cosmokit@1.8.3'
  - '@deepseek-ai/schemastery@3.18.2'

patchedDependencies:
  '@deepseek-ai/dsh-api-session-controller@0.1.2-alpha.2': patches/@deepseek-ai__dsh-api-session-controller@0.1.2-alpha.2.patch
  '@deepseek-ai/dsh-app-boot@0.1.2-alpha.2': patches/@deepseek-ai__dsh-app-boot@0.1.2-alpha.2.patch
  '@deepseek-ai/dsh-client-ui-agent-preset@0.1.2-alpha.2': patches/@deepseek-ai__dsh-client-ui-agent-preset@0.1.2-alpha.2.patch
  '@deepseek-ai/dsh-client-ui-conversation@0.1.2-alpha.2': patches/@deepseek-ai__dsh-client-ui-conversation@0.1.2-alpha.2.patch
  '@deepseek-ai/dsh-client-ui-layout@0.1.2-alpha.2': patches/@deepseek-ai__dsh-client-ui-layout@0.1.2-alpha.2.patch
